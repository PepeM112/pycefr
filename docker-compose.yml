services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend
    env_file: .env
    environment:
      - DATABASE_PATH=/app/database/pycefr.db
    volumes:
      - db-data:/app/database
      - ./backend:/app/backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend-vue
    command: npm run dev
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
