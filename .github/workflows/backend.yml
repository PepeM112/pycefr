name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "pyproject.toml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

      - name: Mypy
        run: mypy .
        continue-on-error: true

      - name: Tests
        run: pytest backend/tests/ -v
